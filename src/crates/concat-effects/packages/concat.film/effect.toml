format = 2

[effect]
id = "concat.film"
name = "Film"
kind = "filter"
category = "Cinematic"
order = 34
intensity = "grain"
description = "A film curve with a real toe and shoulder, warm halation around the lights, and grain that moves. Print stock, not a filter."

[[param]]
key = "grain"
label = "Grain"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "胶片"
category = "电影感"
description = "带真实趾部和肩部的胶片曲线、灯光周围温暖的光晕，以及会动的颗粒。是印片质感，而不是滤镜。"
keywords = ["电影", "颗粒"]

[i18n.zh-Hans.params.grain]
label = "颗粒"

[i18n.zh-Hans.params.warmth]
label = "暖度"
