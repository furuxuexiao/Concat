format = 2

[effect]
id = "concat.after-hours"
name = "After Hours"
kind = "filter"
category = "Cinematic"
order = 37
intensity = "depth"
description = "Deep blacks, a cool cast over everything but the lamps, colour low, a little grain. Late-night desk and monologue footage."

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "grain"
label = "Grain"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "深夜"
category = "电影感"
description = "深沉的黑色，除灯光外整体偏冷，色彩低饱和，带少许颗粒。适合深夜桌前和独白画面。"
keywords = ["夜晚"]

[i18n.zh-Hans.params.depth]
label = "深度"

[i18n.zh-Hans.params.grain]
label = "颗粒"
