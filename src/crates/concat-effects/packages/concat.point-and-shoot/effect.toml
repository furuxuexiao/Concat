format = 2

[effect]
id = "concat.point-and-shoot"
name = "Point and Shoot"
kind = "filter"
category = "Retro"
order = 45
intensity = "flash"
description = "The 2000s point-and-shoot: hard flash, whites blown, colour up, a cool cyan cast, over-sharpened with the sensor's noise."

[[param]]
key = "flash"
label = "Flash"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "noise"
label = "Noise"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "卡片机"
category = "复古"
description = "2000 年代的卡片相机：生硬的闪光、过曝的白色、色彩浓郁、偏冷青色，过度锐化并带有传感器噪点。"
keywords = ["CCD", "千禧", "闪光灯"]

[i18n.zh-Hans.params.flash]
label = "闪光"

[i18n.zh-Hans.params.noise]
label = "噪点"
