[effect]
id = "concat.echo"
name = "Echo"
kind = "audio"
category = "Space"
order = 30
intensity = "decay"
aliases = ["echo"]
description = "One repeat, fading."

[[param]]
key = "delay"
label = "Delay"
min = 0.05
max = 1
default = 0.25
step = 0.05
unit = "s"

[[param]]
key = "decay"
label = "Decay"
min = 0.1
max = 0.9
default = 0.4
step = 0.05

[ffmpeg]
chain = "aecho=0.8:0.85:{round(delay * 1000)}:{fixed(decay, 2)}"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "回声"
category = "空间"
description = "一次渐弱的重复。"
keywords = ["延迟", "回音"]

[i18n.zh-Hans.params.delay]
label = "延迟"

[i18n.zh-Hans.params.decay]
label = "衰减"
