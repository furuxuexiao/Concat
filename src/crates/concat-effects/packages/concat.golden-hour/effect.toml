format = 2

[effect]
id = "concat.golden-hour"
name = "Golden Hour"
kind = "filter"
category = "Everyday"
order = 14
intensity = "glow"
description = "Late light: a warm balance that keeps its brightness, orange in the highlights, a whisper of magenta in the shadows, blacks lifted a touch."

[[param]]
key = "glow"
label = "Glow"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 3500
max = 6500
default = 4600
step = 50
unit = "K"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "黄金时刻"
category = "日常"
description = "傍晚的光线：保持亮度的暖色平衡，高光偏橙，阴影带一丝品红，黑色略微提亮。"
keywords = ["夕阳", "暖色"]

[i18n.zh-Hans.params.glow]
label = "光晕"

[i18n.zh-Hans.params.warmth]
label = "暖度"
