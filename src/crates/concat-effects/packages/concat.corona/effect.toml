format = 2

[effect]
id = "concat.corona"
name = "Corona"
version = 1
kind = "effect"
category = "Film"
order = 151
intensity = "amount"
aliases = ["corona"]
description = "A cool blue-white corona gathered off the picture's blown highlights by a golden-angle spiral blur - built from nothing, not a port of the stock halation."

[[param]]
key = "threshold"
label = "Threshold"
min = 20
max = 95
default = 60
step = 1
unit = "%"

[[param]]
key = "radius"
label = "Radius"
min = 4
max = 60
default = 18
step = 1
unit = "%"

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[[param]]
key = "cool"
label = "Coolness"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"

# The corona is one blur pass, half the layer's pixels on each axis,
# read back by the final pass.
[[wgsl.pass]]
target = "bloom"
shrink = ["2", "2"]

[card]
params = { threshold = 45, amount = 80 }

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "日冕"
category = "胶片"
description = "以黄金角螺旋模糊从画面过曝高光中聚出冷蓝白色的光冕——从零构建，并非照搬常见的光晕。"
keywords = ["光晕", "辉光"]

[i18n.zh-Hans.params.threshold]
label = "阈值"

[i18n.zh-Hans.params.radius]
label = "半径"

[i18n.zh-Hans.params.amount]
label = "强度"

[i18n.zh-Hans.params.cool]
label = "冷度"
