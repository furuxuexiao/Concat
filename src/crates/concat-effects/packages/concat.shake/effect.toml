format = 2

[effect]
id = "concat.shake"
name = "Shake"
kind = "effect"
category = "Shake"
order = 4
intensity = "amount"
description = "A camera that will not keep still: a handheld drift, a nervous jitter or a quake, with a turn and a smear of its own."

[[param]]
key = "style"
label = "Style"
type = "enum"
values = [0, 1, 2]
labels = ["Handheld", "Jitter", "Quake"]
default = 0
min = 0
max = 2

[[param]]
key = "amount"
label = "Amount"
unit = "%"
min = 0
max = 100
step = 1
default = 50

[[param]]
key = "speed"
label = "Speed"
unit = "%"
min = 0
max = 100
step = 1
default = 50

[[param]]
key = "rotation"
label = "Rotation"
unit = "%"
min = 0
max = 100
step = 1
default = 40

[[param]]
key = "blur"
label = "Motion Blur"
unit = "%"
min = 0
max = 100
step = 1
default = 40

[wgsl]
entry = "effect.wgsl"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "抖动"
category = "震动"
description = "停不下来的镜头：手持晃动、紧张的抖动或地震，带有自己的旋转和拖影。"
keywords = ["晃动", "震屏", "手持"]

[i18n.zh-Hans.params.style]
label = "样式"
labels = ["手持", "抖动", "地震"]

[i18n.zh-Hans.params.amount]
label = "强度"

[i18n.zh-Hans.params.speed]
label = "速度"

[i18n.zh-Hans.params.rotation]
label = "旋转"

[i18n.zh-Hans.params.blur]
label = "动态模糊"
