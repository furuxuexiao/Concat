[effect]
id = "concat.treble"
name = "Treble"
kind = "audio"
category = "Tone"
order = 21
intensity = "gain"
aliases = ["treble"]
description = "More sparkle."

[[param]]
key = "gain"
label = "Gain"
min = 0
max = 12
default = 4
step = 0.5
unit = "dB"

[ffmpeg]
chain = "treble=g={fixed(gain, 2)}:f=9000:w=0.7,alimiter=limit=0.95"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "高音增强"
category = "音色"
description = "更多闪亮的高频。"
keywords = ["高音", "高频"]

[i18n.zh-Hans.params.gain]
label = "增益"
