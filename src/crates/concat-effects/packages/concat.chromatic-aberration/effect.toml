format = 2

[effect]
id = "concat.chromatic-aberration"
name = "Chromatic Aberration"
version = 2
kind = "effect"
category = "Distort"
order = 54
intensity = "shift"
aliases = ["chromatic-aberration"]
description = "Red and blue pulled apart towards the edges, the colour fringing of a cheap lens."

[[param]]
key = "shift"
label = "Shift"
type = "int"
min = 1
max = 24
default = 4
step = 1
unit = "px"

[wgsl]
entry = "effect.wgsl"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "色差"
category = "扭曲"
description = "红色和蓝色向画面边缘分离，像廉价镜头的彩色镶边。"
keywords = ["RGB 分离", "色散"]

[i18n.zh-Hans.params.shift]
label = "偏移"
