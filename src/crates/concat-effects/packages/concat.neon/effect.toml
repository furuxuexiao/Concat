format = 2

[effect]
id = "concat.neon"
name = "Neon"
kind = "filter"
category = "Stylised"
shelves = ["Party & Club"]
order = 51
intensity = "glow"
description = "Magenta in the shadows, cyan in the highlights, hard contrast, colour turned up, and the lights themselves blooming. Night streets and signage."

[[param]]
key = "glow"
label = "Glow"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "punch"
label = "Punch"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "霓虹"
category = "风格化"
description = "阴影品红、高光青色，强对比、高饱和，灯光本身也在发光。适合夜晚街道和招牌。"
keywords = ["赛博", "夜景"]

[i18n.zh-Hans.params.glow]
label = "光晕"

[i18n.zh-Hans.params.punch]
label = "力度"
