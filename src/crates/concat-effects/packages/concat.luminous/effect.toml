format = 2

[effect]
id = "concat.luminous"
name = "Luminous"
kind = "filter"
category = "Portrait"
order = 21
intensity = "brighten"
description = "Faces brightened and evened: skin lifted, reds calmed, the balance neutral, the rest of the frame left where it was."

[[param]]
key = "brighten"
label = "Brighten"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "even"
label = "Even"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "亮肤"
category = "人像"
description = "提亮并均匀人脸：肤色提亮、红色压低、白平衡中性，画面其余部分保持原样。"
keywords = ["美白", "人像"]

[i18n.zh-Hans.params.brighten]
label = "提亮"

[i18n.zh-Hans.params.even]
label = "均匀肤色"
