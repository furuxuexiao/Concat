format = 2

[effect]
id = "concat.cool"
name = "Cool"
kind = "filter"
category = "Color"
order = 31
intensity = "temperature"
aliases = ["cool"]
description = "Shifts the picture towards daylight shade."

[[param]]
key = "temperature"
label = "Temperature"
min = 7000
max = 11000
default = 8500
step = 50
unit = "K"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "冷调"
category = "色彩"
description = "让画面偏向日光下的阴凉色调。"
keywords = ["冷色", "蓝调"]

[i18n.zh-Hans.params.temperature]
label = "色温"
