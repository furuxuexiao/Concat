format = 2

[effect]
id = "concat.bronze"
name = "Bronze"
kind = "filter"
category = "Retro"
order = 42
intensity = "tone"
description = "Sepia that keeps its contrast and its highlights, so it reads as old film rather than a brown wash."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "古铜"
category = "复古"
description = "保留对比和高光的棕褐色调，看起来像老胶片，而不是一层褐色。"
keywords = ["棕褐", "怀旧"]

[i18n.zh-Hans.params.tone]
label = "复古度"

[i18n.zh-Hans.params.contrast]
label = "对比度"
