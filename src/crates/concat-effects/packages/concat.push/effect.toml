format = 2

[effect]
id = "concat.push"
name = "Push"
kind = "transition"
category = "Slide"
order = 5
aliases = ["push"]
description = "The next shot shoves the last one out of frame, both moving as one, with a streak of motion blur at full speed."

[[param]]
key = "direction"
label = "Direction"
type = "enum"
values = [0, 1, 2, 3]
labels = ["Left", "Right", "Up", "Down"]
default = 0
min = 0
max = 3

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "推移"
category = "滑动"
description = "下一个镜头把上一个推出画面，两者一起移动，全速时带有动态模糊。"
keywords = ["推入", "滑动"]

[i18n.zh-Hans.params.direction]
label = "方向"
labels = ["向左", "向右", "向上", "向下"]
