format = 2

[effect]
id = "concat.soft-light"
name = "Soft Light"
kind = "filter"
category = "Everyday"
order = 13
intensity = "lift"
description = "A matte: blacks lifted, whites eased down, contrast low, and a soft bloom in the light with cream in it. Airy and flattering."

[[param]]
key = "lift"
label = "Lift"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "柔光"
category = "日常"
description = "哑光效果：黑色提亮、白色压低、低对比，亮部带奶油色的柔和光晕。轻盈又讨喜。"
keywords = ["柔和", "奶油"]

[i18n.zh-Hans.params.lift]
label = "提亮黑色"

[i18n.zh-Hans.params.warmth]
label = "暖度"
