format = 2

[effect]
id = "concat.halftone"
name = "Halftone"
version = 2
kind = "effect"
category = "Retro"
order = 76
intensity = "size"
description = "The picture reduced to a grid of black and white dots."

[[param]]
key = "size"
label = "Dot size"
type = "int"
min = 4
max = 40
default = 6
step = 1
unit = "px"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "半调网点"
category = "复古"
description = "画面变成黑白网点。"
keywords = ["网点", "漫画"]

[i18n.zh-Hans.params.size]
label = "网点大小"
