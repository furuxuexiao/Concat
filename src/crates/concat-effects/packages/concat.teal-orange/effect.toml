format = 2

[effect]
id = "concat.teal-orange"
name = "Teal & Orange"
kind = "filter"
category = "Cinematic"
order = 30
intensity = "amount"
description = "Teal in the shadows, orange in the highlights, skin held as skin, a film curve over it. The blockbuster grade, and the most requested look there is."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[[param]]
key = "skin"
label = "Protect skin"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "青橙"
category = "电影感"
description = "阴影偏青、高光偏橙、肤色保持自然，再加一条胶片曲线。好莱坞大片的调色，也是最受欢迎的色调。"
keywords = ["电影", "大片"]

[i18n.zh-Hans.params.amount]
label = "强度"

[i18n.zh-Hans.params.contrast]
label = "对比度"

[i18n.zh-Hans.params.skin]
label = "肤色保护"
