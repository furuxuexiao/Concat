[effect]
id = "concat.telephone"
name = "Telephone"
kind = "audio"
category = "Tone"
order = 22
intensity = "drive"
aliases = ["telephone"]
description = "The narrow band of a phone line."

[[param]]
key = "drive"
label = "Drive"
min = 0
max = 10
default = 3
step = 0.5

[ffmpeg]
chain = "highpass=f=400,lowpass=f=3400,equalizer=f=1600:t=q:w=1.4:g={fixed(3 + drive / 2, 2)},alimiter=limit=0.92"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "电话"
category = "音色"
description = "电话线路的窄频带声音。"
keywords = ["电话音", "听筒"]

[i18n.zh-Hans.params.drive]
label = "失真度"
