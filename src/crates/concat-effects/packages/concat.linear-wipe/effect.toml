format = 2

[effect]
id = "concat.linear-wipe"
name = "Linear Wipe"
kind = "transition"
category = "Wipe"
order = 10
aliases = ["wipe-left", "wipe-right"]
description = "A straight line crosses the frame and leaves the next shot behind it."

[[param]]
key = "direction"
label = "Direction"
type = "enum"
values = [0, 1, 2, 3]
labels = ["Left to Right", "Right to Left", "Top to Bottom", "Bottom to Top"]
default = 0
min = 0
max = 3

[[param]]
key = "softness"
label = "Softness"
unit = "%"
min = 0
max = 100
step = 1
default = 20

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "线性擦除"
category = "擦除"
description = "一条直线划过画面，身后留下下一个镜头。"
keywords = ["擦除", "划变"]

[i18n.zh-Hans.params.direction]
label = "方向"
labels = ["从左到右", "从右到左", "从上到下", "从下到上"]

[i18n.zh-Hans.params.softness]
label = "柔和度"
