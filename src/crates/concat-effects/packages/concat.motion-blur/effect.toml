format = 2

[effect]
id = "concat.motion-blur"
name = "Motion Blur"
kind = "effect"
category = "Blur"
order = 22
version = 2
intensity = "length"
aliases = ["motion-blur"]
description = "A streak along a line, as if the camera panned."

[[param]]
key = "length"
label = "Length"
min = 2
max = 60
default = 18
step = 1
unit = "px"

[[param]]
key = "angle"
label = "Angle"
min = -90
max = 90
default = 0
step = 1
unit = "°"

[wgsl]
entry = "effect.wgsl"

# A coarse Gaussian along the line, then straight lines drawn between its
# samples.
[[wgsl.pass]]
target = "coarse"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "动态模糊"
category = "模糊"
description = "沿一条直线拖影，就像摄像机在横摇。"
keywords = ["运动模糊", "拖影"]

[i18n.zh-Hans.params.length]
label = "长度"

[i18n.zh-Hans.params.angle]
label = "角度"
