format = 2

[effect]
id = "concat.clean"
name = "Clean"
kind = "filter"
category = "Everyday"
order = 12
intensity = "amount"
description = "Barely there: neutral, a gentle curve, a touch more colour, and the reds calmed so a face reads even. What a talking head wants."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

