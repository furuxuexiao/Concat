format = 2

[effect]
id = "concat.light-leak-flash"
name = "Light Leak Flash"
kind = "transition"
category = "Light"
order = 16
description = "Organic overexposed film burn flash bridging the cut."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "fadewhite"
fallback = "cross-fade"

# By the usual point of the cut the flash has burned the frame white.
[card]
progress = 0.15

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "漏光闪烁"
category = "光效"
description = "自然的过曝胶片灼烧闪光衔接两个镜头。"
keywords = ["漏光", "闪光"]

[i18n.zh-Hans.params.strength]
label = "强度"
