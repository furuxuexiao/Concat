[effect]
id = "concat.cathedral"
name = "Cathedral"
kind = "audio"
category = "Space"
order = 34
intensity = "size"
aliases = ["cathedral"]
description = "Stone and height: reflections that take a while to arrive."

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[ffmpeg]
let = [
  "scale = 0.5 + (size / 100) * 1.5",
]
chain = "aecho=0.8:0.9:{round(120 * scale)}|{round(230 * scale)}|{round(390 * scale)}|{round(600 * scale)}:0.6|0.5|0.4|0.3"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "大教堂"
category = "空间"
description = "石墙与高穹顶：回声来得很迟。"
keywords = ["混响", "回声"]

[i18n.zh-Hans.params.size]
label = "空间大小"
