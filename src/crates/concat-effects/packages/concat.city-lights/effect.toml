format = 2

[effect]
id = "concat.city-lights"
name = "City Lights"
kind = "filter"
category = "Stylised"
order = 52
intensity = "lights"
description = "Night city: the lights and signs made vivid and blooming, blacks kept deep and cool, faces left clean. Made for the strip."

[[param]]
key = "lights"
label = "Lights"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "城市灯火"
category = "风格化"
description = "夜晚的城市：灯光和招牌鲜艳绽放，黑色深沉偏冷，人脸保持干净。为街头夜景而生。"
keywords = ["夜景", "霓虹"]

[i18n.zh-Hans.params.lights]
label = "灯光"

[i18n.zh-Hans.params.depth]
label = "深度"
