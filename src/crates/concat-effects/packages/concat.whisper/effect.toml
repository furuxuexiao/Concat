[effect]
id = "concat.whisper"
name = "Whisper"
kind = "audio"
category = "Voice"
order = 16
intensity = "air"
aliases = ["breathy", "intimate"]
description = "Airy, breathy tone with attenuated low end and enhanced presence."

[[param]]
key = "air"
label = "Air"
min = 1
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "highpass=f=500,equalizer=f=3200:t=q:w=1.4:g={fixed(2 + air * 0.6, 2)},equalizer=f=7500:t=q:w=1.2:g={fixed(1 + air * 0.5, 2)},alimiter=limit=0.92"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "耳语"
category = "变声"
description = "空灵带气声的音色，削弱低频、增强临场感。"
keywords = ["悄悄话", "气声"]

[i18n.zh-Hans.params.air]
label = "气声"
