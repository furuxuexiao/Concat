format = 2

[effect]
id = "concat.cloudless-sky"
name = "Cloudless Sky"
kind = "filter"
category = "Everyday"
order = 15
intensity = "sky"
description = "Skies deeper and bluer, foliage cooler and calmer, the rest of the picture and every face untouched. Travel footage."

[[param]]
key = "sky"
label = "Sky"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "greens"
label = "Greens"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# The reference picture has no sky; the card pushes both bands so the
# blue wall and the green jumper show the look.
[card]
params = { sky = 100, greens = 100 }

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "晴空"
category = "日常"
description = "天空更深更蓝，植物更冷静清爽，画面其余部分和人脸不受影响。适合旅行视频。"
keywords = ["蓝天", "旅行"]

[i18n.zh-Hans.params.sky]
label = "天空"

[i18n.zh-Hans.params.greens]
label = "绿色"
