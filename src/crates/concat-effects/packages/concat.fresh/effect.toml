format = 2

[effect]
id = "concat.fresh"
name = "Fresh"
kind = "filter"
category = "Everyday"
order = 10
intensity = "pop"
description = "Daylight footage made to pop: midtones lifted, colour brought up where it is muted, a breath of mint in the brightest whites, skin left alone."

[[param]]
key = "pop"
label = "Pop"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "brightness"
label = "Brightness"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "清新"
category = "日常"
description = "让日光画面更通透：提亮中间调，补足偏淡的色彩，最亮的白色带一丝薄荷绿，肤色保持不变。"
keywords = ["通透", "小清新"]

[i18n.zh-Hans.params.pop]
label = "通透"

[i18n.zh-Hans.params.brightness]
label = "亮度"
