format = 2

[effect]
id = "concat.light-leak-transition"
name = "Light Leak"
kind = "transition"
category = "Light"
order = 13
description = "A wash of warm light flares across the frame and the next shot is left behind it as it passes."

[[param]]
key = "warmth"
label = "Warmth"
unit = "%"
min = 0
max = 100
step = 1
default = 70

[transition]
fallback = "cross-fade"
xfade = "fadewhite"
entry = "effect.wgsl"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "漏光"
category = "光效"
description = "一片温暖的光掠过画面，光过之后留下下一个镜头。"
keywords = ["光效", "炫光"]

[i18n.zh-Hans.params.warmth]
label = "暖度"
