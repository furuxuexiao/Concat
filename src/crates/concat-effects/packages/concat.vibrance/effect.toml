format = 2

[effect]
id = "concat.vibrance"
name = "Vibrance"
kind = "filter"
category = "Color"
order = 32
# 2: the parameter is `amount`; a project that stored `intensity` for it
# takes the default.
version = 2
intensity = "amount"
aliases = ["vibrance"]
description = "Richer colour where it is muted, without blowing out what is already strong."

[[param]]
key = "amount"
label = "Amount"
min = 0.1
max = 2
default = 0.7
step = 0.05

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "自然饱和度"
category = "色彩"
description = "让偏淡的色彩更浓郁，又不会让本来浓烈的色彩过饱和。"
keywords = ["鲜艳度"]

[i18n.zh-Hans.params.amount]
label = "强度"
