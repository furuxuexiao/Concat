[effect]
id = "concat.robot"
name = "Robot"
kind = "audio"
category = "Voice"
order = 13
intensity = "depth"
aliases = ["robot"]
description = "A metallic, modulated voice."

[[param]]
key = "depth"
label = "Depth"
min = 1
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "aphaser=type=t:speed={fixed(0.4 + (depth / 10) * 1.6, 2)}:decay=0.6,flanger=delay=2:depth=4:speed=0.8,equalizer=f=1800:t=q:w=1.2:g=3,alimiter=limit=0.94"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "机器人"
category = "变声"
description = "金属质感、经过调制的声音。"
keywords = ["变声", "电音"]

[i18n.zh-Hans.params.depth]
label = "深度"
