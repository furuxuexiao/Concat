format = 2

[effect]
id = "concat.spin"
name = "Spin"
kind = "transition"
category = "Spin"
order = 6
description = "The frame whirls round, blurring as it turns, and the next shot spins out of the turn and comes to rest."

[[param]]
key = "turns"
label = "Turns"
min = 0.5
max = 2
step = 0.25
default = 1

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "旋转"
category = "旋转"
description = "画面旋转起来，边转边模糊，下一个镜头从旋转中转出并停稳。"
keywords = ["旋转", "转圈"]

[i18n.zh-Hans.params.turns]
label = "圈数"
