format = 2

[effect]
id = "concat.moody"
name = "Moody"
kind = "filter"
category = "Cinematic"
order = 31
intensity = "depth"
description = "Blacks crushed by a film toe, colour drained, bronze through the middle, cool in the shadows, the corners closing in."

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "情绪"
category = "电影感"
description = "胶片趾部压暗黑色，色彩褪去，中间调古铜，阴影偏冷，四角收暗。"
keywords = ["暗调", "氛围"]

[i18n.zh-Hans.params.depth]
label = "深度"

[i18n.zh-Hans.params.warmth]
label = "暖度"
