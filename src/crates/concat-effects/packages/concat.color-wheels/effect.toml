format = 2

[effect]
id = "concat.color-wheels"
name = "Color Wheels"
kind = "effect"
category = "Color"
order = 14
description = "Lift, gamma and gain: the shadows, midtones and highlights each pushed towards a hue and made brighter or darker."

[[param]]
key = "lift"
group = "Wheels"
label = "Lift"
type = "wheel"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[[param]]
key = "gamma"
group = "Wheels"
label = "Gamma"
type = "wheel"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[[param]]
key = "gain"
group = "Wheels"
label = "Gain"
type = "wheel"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[wgsl]
entry = "effect.wgsl"
space = "display"

# At rest the picture is as shot; the card shows a teal shadow and a warm
# highlight.
[card]
params = { "lift.x" = 0.0, "lift.y" = -0.6, "gain.x" = 0.35, "gain.y" = 0.45 }

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "色轮"
category = "色彩"
description = "暗部、中间调和高光：分别推向某个色相，并调亮或调暗。"
keywords = ["调色", "一级调色"]

[i18n.zh-Hans.params.lift]
label = "暗部"
group = "色轮"

[i18n.zh-Hans.params.gamma]
label = "中间调"
group = "色轮"

[i18n.zh-Hans.params.gain]
label = "高光"
group = "色轮"
