format = 2

[effect]
id = "concat.vhs"
name = "VHS"
kind = "filter"
category = "Retro"
order = 44
intensity = "bleed"
description = "Colour bleeding sideways, scan lines, softness, tape noise and too much saturation, with the slight vertical smear of a worn head."

[[param]]
key = "bleed"
label = "Bleed"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "lines"
label = "Lines"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "VHS 录像带"
category = "复古"
description = "色彩横向渗开，扫描线、柔化、磁带噪点和过高的饱和度，还有磨损磁头轻微的纵向拖影。"
keywords = ["录像带", "复古", "DV"]

[i18n.zh-Hans.params.bleed]
label = "渗色"

[i18n.zh-Hans.params.lines]
label = "扫描线"
