format = 2

[effect]
id = "concat.iris"
name = "Iris"
kind = "transition"
category = "Wipe"
order = 11
description = "A round opening grows from the centre until the next shot fills the frame."

[[param]]
key = "softness"
label = "Softness"
unit = "%"
min = 0
max = 100
step = 1
default = 15

[transition]
fallback = "cross-fade"
xfade = "circleopen"
entry = "effect.wgsl"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "圆形展开"
category = "擦除"
description = "一个圆形开口从中心扩大，直到下一个镜头铺满画面。"
keywords = ["光圈", "圆形"]

[i18n.zh-Hans.params.softness]
label = "柔和度"
