format = 2

[effect]
id = "concat.window-seat"
name = "Window Seat"
kind = "filter"
category = "Cinematic"
order = 35
intensity = "haze"
description = "Soft cinema: blacks lifted, the light blooming warm, shadows a touch cool, skin kept. The look of a story told in a window seat."

[[param]]
key = "haze"
label = "Haze"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "靠窗座位"
category = "电影感"
description = "柔和的电影感：黑色提亮、光线温暖泛光、阴影略冷、肤色保持。像在靠窗座位上讲的故事。"
keywords = ["文艺", "柔和"]

[i18n.zh-Hans.params.haze]
label = "朦胧"

[i18n.zh-Hans.params.warmth]
label = "暖度"
