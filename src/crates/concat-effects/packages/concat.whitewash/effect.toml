format = 2

[effect]
id = "concat.whitewash"
name = "Whitewash"
kind = "filter"
category = "Everyday"
order = 17
intensity = "matte"
description = "Bright and matte: whites soft and cool, blacks lifted well off the floor, colour quiet. The clean minimal look of a white room."

[[param]]
key = "matte"
label = "Matte"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "cool"
label = "Cool"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "白墙"
category = "日常"
description = "明亮的哑光：白色柔和偏冷，黑色明显提亮，色彩安静。白色房间般干净的极简色调。"
keywords = ["奶白", "极简"]

[i18n.zh-Hans.params.matte]
label = "哑光"

[i18n.zh-Hans.params.cool]
label = "冷调"
