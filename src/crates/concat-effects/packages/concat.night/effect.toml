format = 2

[effect]
id = "concat.night"
name = "Night"
kind = "filter"
category = "Cinematic"
order = 33
intensity = "lift"
description = "Low light opened up: shadows lifted with the noise softened before it rises, whites held, the blue of the night kept."

[[param]]
key = "lift"
label = "Lift"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "clarity"
label = "Clarity"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "夜景"
category = "电影感"
description = "打开暗光画面：先柔化噪点再提亮阴影，保持白色，保留夜晚的蓝色。"
keywords = ["暗光", "夜晚"]

[i18n.zh-Hans.params.lift]
label = "提亮暗部"

[i18n.zh-Hans.params.clarity]
label = "清晰度"
