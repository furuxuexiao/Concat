format = 2

[effect]
id = "concat.glow"
name = "Glow"
kind = "effect"
category = "Stylize"
shelves = ["Featured", "Light & Shadow"]
order = 42
version = 2
intensity = "amount"
aliases = ["glow"]
description = "A soft bloom around the bright parts of the picture."

[[param]]
key = "amount"
label = "Amount"
min = 10
max = 100
default = 45
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"

# The glow is a wide Gaussian, drawn across and then down at a quarter of
# the layer's pixels, four of which it is wide.
[[wgsl.pass]]
target = "across"
shrink = ["4", "1"]

[[wgsl.pass]]
target = "down"
shrink = ["4", "4"]

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "发光"
category = "风格化"
description = "画面亮部周围柔和的光晕。"
keywords = ["辉光", "柔光"]

[i18n.zh-Hans.params.amount]
label = "强度"
