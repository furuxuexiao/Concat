format = 2

[effect]
id = "concat.vivid"
name = "Vivid"
kind = "filter"
category = "Everyday"
order = 11
intensity = "colour"
description = "Colour that sings and contrast that bites, with a little edge: the look that reads as a better camera. Skin is held back from the boost."

[[param]]
key = "colour"
label = "Colour"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "punch"
label = "Punch"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "鲜艳"
category = "日常"
description = "色彩鲜明、对比有力，略带锐度：看起来像换了台更好的相机。肤色不会被过度增强。"
keywords = ["浓郁", "高饱和"]

[i18n.zh-Hans.params.colour]
label = "色彩"

[i18n.zh-Hans.params.punch]
label = "力度"
