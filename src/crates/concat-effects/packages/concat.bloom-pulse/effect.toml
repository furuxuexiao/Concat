format = 2

[effect]
id = "concat.bloom-pulse"
name = "Bloom Pulse"
kind = "effect"
category = "Light"
shelves = ["Featured"]
order = 72
version = 2
intensity = "amount"
description = "A soft bloom over the highlights that breathes in and out."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0.5
max = 5
default = 2
step = 0.1

[wgsl]
entry = "effect.wgsl"

# The bloom is the highlights' light spread by a Gaussian, drawn across and
# then down at a quarter of the layer's pixels, three of which it is wide.
[[wgsl.pass]]
target = "across"
shrink = ["4", "1"]

[[wgsl.pass]]
target = "down"
shrink = ["4", "4"]

# Simplified Chinese: what the window shows when the interface is in
# 简体中文. The English above stays the package's own words.
[i18n.zh-Hans]
name = "光晕脉冲"
category = "光效"
description = "高光上柔和的光晕，有节奏地一明一暗。"
keywords = ["呼吸", "发光"]

[i18n.zh-Hans.params.amount]
label = "强度"

[i18n.zh-Hans.params.speed]
label = "速度"
